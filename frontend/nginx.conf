server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # v0.5.0: original host INCLUDING the port, so the backend's same-origin
        # check for signed-in writes (backend/auth/dependencies.py) matches the
        # browser's Origin header (e.g. http://192.168.1.20:3000).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade;

        # Large uploads + slow local LLM inference: POST /api/analysis/analyze
        # is one synchronous request that can legitimately run for a long
        # time on a large declaration (progress is polled separately).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100M;
    }

    # SSE streaming
    location /api/analysis/analyze/stream {
        proxy_pass http://backend:8000;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }
}
